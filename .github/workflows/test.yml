name: PatchAI Testing Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
    
    - name: Validate backend Python files
      run: |
        python - <<'PY'
        import py_compile
        from pathlib import Path

        targets = [
            Path("backend/main.py"),
            Path("backend/core"),
            Path("backend/models"),
            Path("backend/routes"),
            Path("backend/services"),
        ]

        files = []
        for target in targets:
            if target.is_file():
                files.append(target)
            else:
                files.extend(sorted(target.rglob("*.py")))

        failed = []
        for file_path in files:
            try:
                py_compile.compile(str(file_path), doraise=True)
                print(f"OK {file_path}")
            except Exception as exc:
                failed.append((file_path, exc))
                print(f"FAIL {file_path}: {exc}")

        if failed:
            raise SystemExit(1)
        PY
    
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: npm ci

    - name: Run frontend smoke tests
      env:
        CI: 'true'
        REACT_APP_BACKEND_URL: https://patchai-backend.onrender.com
        REACT_APP_SUPABASE_URL: https://example.supabase.co
        REACT_APP_SUPABASE_ANON_KEY: example-anon-key
      run: npm test -- --watchAll=false

    - name: Build frontend
      env:
        DISABLE_ESLINT_PLUGIN: 'true'
        GENERATE_SOURCEMAP: 'true'
        INLINE_RUNTIME_CHUNK: 'false'
        REACT_APP_BACKEND_URL: https://patchai-backend.onrender.com
        REACT_APP_SUPABASE_URL: https://example.supabase.co
        REACT_APP_SUPABASE_ANON_KEY: example-anon-key
      run: npx react-scripts build

